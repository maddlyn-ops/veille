<!DOCTYPE html>
<html lang="fr">
<head>

<title>Ta veille du {{DATE}}</title>

<body style="margin:0;padding:0;background:#f5f3ef;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1a1a1a;">

<table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="background:#f5f3ef;">
  <tr>
    <td align="center" style="padding:32px 16px;">

        <!-- Header -->

          <td style="padding:32px 32px 8px 32px;">
            <p style="margin:0;font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:#8a8a8a;font-weight:600;">Veille du {{DATE_LISIBLE}}</p>

          </td>
        </tr>

        <!-- Édito -->
        <tr>
          <td style="padding:16px 32px 24px 32px;">
            <p style="margin:0;font-size:16px;line-height:1.6;color:#3a3a3a;font-style:italic;border-left:3px solid #d4c4a8;padding-left:16px;">
              {{EDITO}}
            </p>
          </td>
        </tr>

        <!-- Articles par catégorie -->
        <tr>
          <td style="padding:0 32px 16px 32px;">
            {{BLOCS_CATEGORIES}}
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:24px 32px 32px 32px;border-top:1px solid #eeeeee;">
            <p style="margin:0;font-size:12px;color:#8a8a8a;line-height:1.5;">

              Pour ajuster les sources ou le ton, édite le workflow "Veille quotidienne" dans n8n.
