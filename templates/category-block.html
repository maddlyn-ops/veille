<!-- Bloc réutilisé pour chaque catégorie (généré dans le Code node de n8n) -->

<div style="margin-top:24px;">
  <h2 style="margin:0 0 12px 0;font-size:14px;letter-spacing:1px;text-transform:uppercase;color:#1a1a1a;font-weight:700;border-bottom:2px solid #1a1a1a;padding-bottom:8px;">
    {{LABEL_CATEGORIE}}
  </h2>

  <!-- Répété pour chaque article de la catégorie -->
  <div style="margin:16px 0;padding-bottom:16px;border-bottom:1px solid #f0f0f0;">
    <a href="{{URL}}" style="text-decoration:none;color:#1a1a1a;">
      <h3 style="margin:0;font-size:17px;line-height:1.3;font-weight:600;">{{TITRE}}</h3>
    </a>
    <p style="margin:4px 0 0 0;font-size:12px;color:#8a8a8a;">{{SOURCE}} · score {{SCORE}}/10</p>
    <p style="margin:8px 0 0 0;font-size:14px;line-height:1.5;color:#3a3a3a;">{{RESUME}}</p>
    <p style="margin:8px 0 0 0;font-size:13px;line-height:1.5;color:#6a6a6a;">
      <strong style="color:#b08968;">Pourquoi :</strong> {{POURQUOI}}
    </p>
    <a href="{{URL}}" style="display:inline-block;margin-top:8px;font-size:13px;color:#b08968;text-decoration:none;font-weight:600;">Lire l'article →</a>
  </div>

</div>
